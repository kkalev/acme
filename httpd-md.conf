# Load required modules
LoadModule md_module modules/mod_md.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule ssl_module modules/mod_ssl.so

Listen 443

# Debugging
# LogLevel ssl:debug md:debug

# mod_md state directory (must be persisted via volume)
MDStoreDir /usr/local/apache2/md

# ACME CA and Account Registration
MDCertificateAuthority ${ACME_DIRECTORY_URL}
MDCertificateAgreement accepted
MDContactEmail ${ACME_CONTACT_EMAIL}

# External Account Binding (Key ID and Base64 HMAC Key)
MDExternalAccountBinding ${ACME_EAB_KID} ${ACME_EAB_HMAC}

# Port mapping: ensures mod_md responds correctly if behind a reverse proxy/NAT
# format: <port-apache-listens-on>:<external-port-seen-by-CA>
MDPortMap 80:80 443:443

# Use http-01 challenge for domain validation
MDCAChallenges http-01

# Define your Managed Domain
MDomain ${APP_DOMAIN}
MDRenewMode auto
MDCheckInterval 12h
# Wait for 5 seconds for activation of new certificates
MDActivationDelay 5s

# Notification script for certificate changes
MDMessageCmd /usr/local/bin/md-notify.sh

# HTTP-to-HTTPS redirect (mod_md can automatically redirect traffic)
MDRequireHttps temporary

# Standard HTTP VirtualHost (Required for http-01 challenge)
<VirtualHost *:80>
    ServerName ${APP_DOMAIN}
    DocumentRoot /usr/local/apache2/htdocs
    # Enable md-status
    <Location "/.well-known/md-status">
        SetHandler md-status
        #Require ip <network>/24
    </Location>
</VirtualHost>

# HTTPS VirtualHost (mod_md automatically injects the certificate)
<VirtualHost *:443>
    ServerName ${APP_DOMAIN}
    DocumentRoot /usr/local/apache2/htdocs

    SSLEngine on
    # Do NOT set SSLCertificateFile or SSLCertificateKeyFile here.
    # mod_md injects them automatically for MDomain members.

    # Enable md-status
    <Location "/.well-known/md-status">
        SetHandler md-status
        #Require ip <network>/24
    </Location>
</VirtualHost>